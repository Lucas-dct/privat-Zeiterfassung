name: Android-APK bauen
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web-Dateien zusammenstellen
        run: mkdir www && cp index.html style.css app.js logic.js sw.js manifest.webmanifest www/ && cp -r icons www/
      - name: Capacitor und Android-Projekt anlegen
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Zeiterfassung de.privat.zeiterfassung --web-dir www
          npx cap add android
          npx cap sync android
      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zeiterfassung-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
